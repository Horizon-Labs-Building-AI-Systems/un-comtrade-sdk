# GitHub CodeQL analysis for un-comtrade-sdk.
#
# This workflow replaces GitHub's managed default CodeQL
# setup (which auto-detects languages from the repo and
# attempted to analyze the MkDocs `extra.js` helper script
# as JavaScript — failing with "Only found JavaScript or
# TypeScript files that were empty or contained syntax
# errors."). The language matrix is locked to `python`
# only; no JavaScript / TypeScript analysis is run.
#
# Triggers: push to main, pull_request targeting main,
# weekly schedule (Mondays 06:00 UTC), and manual dispatch.
# Mirrors the cadence of the Security workflow
# (.github/workflows/security.yml).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"