name: Release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PEP 517 builder
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify artifacts exist
        run: |
          test -f dist/*.whl  || (echo "::error::wheel not found in dist/" && exit 1)
          test -f dist/*.tar.gz || (echo "::error::sdist not found in dist/" && exit 1)
          echo "Release artifacts:"
          ls -la dist/

      # CI-012 ships build + artifact upload only.
      # PyPI / TestPyPI publication is CI-013
      # (or a future follow-up task). Tag-driven
      # release pipelines MUST NOT publish
      # without a human-confirmed
      # `workflow_dispatch` step or an explicit
      # `release: published` gate.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Verify artifacts with twine check
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*

      # Publishes to https://test.pypi.org/. The
      # PyPI production publish is a separate job
      # (CI-014, gated on the TestPyPI smoke).
      # `TEST_PYPI_API_TOKEN` must be configured
      # in the repo's `Settings → Secrets and
      # variables → Actions`.
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    needs: publish-testpypi
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    # Two authentication modes are supported:
    #
    # 1. **Trusted Publisher (PEP 740, OIDC)** —
    #    `id-token: write` lets `pypa/gh-action-pypi-publish`
    #    exchange a short-lived GitHub OIDC token for a
    #    PyPI upload token. No long-lived secret lives
    #    in the repo. Configure the publisher at
    #    https://pypi.org/manage/account/publishing/
    #    pointing at this repo + workflow
    #    `release.yml` + environment (none by
    #    default — see the `environment:` line below).
    #
    # 2. **API token** — set `PYPI_API_TOKEN` in
    #    `Settings → Secrets and variables → Actions`.
    #    The PyPA action will use the token when
    #    present and fall back to Trusted Publisher
    #    when `password` is empty and `id-token:
    #    write` is granted.
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist

      - name: Verify artifacts with twine check
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*

      # Publishes to https://pypi.org/. The
      # `repository-url` is intentionally omitted
      # so the action defaults to production PyPI.
      # Authentication is resolved in this order:
      #
      #   1. `password` (PYPI_API_TOKEN) — if set.
      #   2. Trusted Publisher OIDC — if
      #      `id-token: write` is granted and
      #      `password` is empty.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true