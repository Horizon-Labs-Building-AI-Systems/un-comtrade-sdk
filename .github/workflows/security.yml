name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install PEP 517 builder + pip-audit
        run: pip install build pip-audit

      - name: Build wheel
        run: python -m build --wheel

      - name: Create fresh virtual environment
        run: python -m venv .ci-audit-venv

      - name: Install wheel + freeze runtime dependency tree
        run: |
          set -e
          .ci-audit-venv/bin/pip install --quiet dist/*.whl
          # `pip-audit` cannot audit the local project itself
          # (it is not on PyPI), and `pip_audit` on a full env
          # would surface unrelated tooling vulns (pytest,
          # mypy, ...). Freezing the runtime tree minus the
          # project itself gives a clean signal of what a
          # consumer installs.
          .ci-audit-venv/bin/pip freeze --exclude un-comtrade-sdk \
            > .ci-audit-reqs.txt

      - name: Run pip-audit on runtime dependency tree
        run: |
          set -e
          .ci-audit-venv/bin/pip install --quiet pip-audit
          .ci-audit-venv/bin/pip-audit --strict \
            --requirement .ci-audit-reqs.txt

      - name: Remove audit venv
        if: always()
        run: rm -rf .ci-audit-venv .ci-audit-reqs.txt

  secrets:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit,
          # not just the latest push. Shallow clones miss
          # secrets introduced and then "fixed" in earlier
          # commits.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # GITHUB_TOKEN is required so gitleaks-action can
          # upload its SARIF report to the Security tab on
          # failures. The token is provisioned by the runner;
          # no manual secret wiring is required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}