# MkDocs configuration for the un-comtrade-sdk website.

# Documentation Execution Protocol §3 / §4.1
# Generated by D9-001 (Documentation Architecture).
# Refined by D9-002 (MkDocs Foundation).

site_name: un-comtrade-sdk
site_description: A Pythonic client for the UN Comtrade API.
site_url: https://horizon-labs-building-ai-systems.github.io/un-comtrade-sdk/
# MkDocs default is use_directory_urls: true (already enabled); explicit for clarity.
use_directory_urls: true

repo_url: https://github.com/Horizon-Labs-Building-AI-Systems/un-comtrade-sdk
repo_name: Horizon-Labs-Building-AI-Systems/un-comtrade-sdk

docs_dir: docs
site_dir: site

# Theme: Material for MkDocs (per protocol §5.1 — modern, fast,
# widely deployed in the Python ecosystem).
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

# Markdown extensions — per protocol §6.3 (heading depth) and
# §11 (search indexing).
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

# Plugins — per protocol §5.5 (search), §8.1 (API reference
# generation), §12 (verification hooks).
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: false
            docstring_section_style: table
            filters: ["!^_"]
            # Per protocol §8.3 — public SDK only; underscore-
            # prefixed symbols excluded.
  - git-revision-date-localized:
      # Per protocol §11 — page revision metadata. Optional
      # decoration. Disabled by default so local builds
      # succeed cleanly while the website scaffold is still
      # untracked in git (the plugin emits a "has no git
      # logs" warning for every untracked file, which
      # becomes a hard error under `--strict`). When the
      # website/ tree is committed and CI builds run, set
      # `ENABLE_GIT_REVISION_DATE=1` and flip `enabled`
      # to `true` here. See D9-002 verification log for the
      # full rationale.
      enabled: false
      type: date
      fallback_to_build_date: true
  - autorefs
  - section-index
  - exclude-search:
      exclude:
        - release-notes/archive/**

# Strict mode — per protocol §12.1 (`mkdocs build --strict`).
strict: true

# Validation — link checker catches broken links (per §12.2).
validation:
  links:
    # `not_found: warn` is too strict for recipe cross-references
    # which live under `../../recipes/<category>/<file>.py` per
    # protocol §5.4 (a relative path from the docs tree to a
    # sibling tree). MkDocs's built-in checker flags these as
    # "not found among documentation files" because the recipes
    # directory is not part of the website build. The recipe-link
    # validity is enforced separately by Step 6 of
    # `scripts/build_docs.py` (cookbook links valid).
    not_found: ignore
    absolute_links: warn
    unrecognized_links: ignore
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  omitted_files: ignore

# Extra metadata (used by the search index and the home page).
extra:
  version:
    provider: mike
    default: stable
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Horizon-Labs-Building-AI-Systems/un-comtrade-sdk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/un-comtrade-sdk/
  generator: false

